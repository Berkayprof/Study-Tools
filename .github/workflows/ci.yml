
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popup/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: popup

      - name: Build popup
        run: npm run build
        working-directory: popup

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find src popup -path 'popup/dist' -prune \
            -o -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check

      - name: Validate Chromium manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Validate Firefox manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest-firefox.json', 'utf8'))"

      - name: Verify popup build
        run: test -d popup/dist

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popup/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: popup

      - name: Audit dependencies
        run: npm audit --omit=dev
        working-directory: popup
